[project]
name = "stream-02"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.9, <=3.12"
dependencies = [
    "aiohttp>=3.13.5",
    "fastapi>=0.128.8",
    "httpx[socks]>=0.28.1",
    "huggingface-hub>=1.8.0",
    "librosa>=0.11.0",
    "numpy>=1.24.0",
    "Pillow>=10.0.0",
    "pip>=26.0.1",
    "pydantic>=2.13.4",
    "python-dotenv>=1.2.1",
    "requests>=2.31.0",
    "soundfile>=0.12.0",
    "uvicorn>=0.39.0",
]

[tool.pytest.ini_options]
testpaths = ["llm_server/tests", "backend/tests"]
pythonpath = ["."]
markers = [
    "integration: tests that require a real C++ llama-server process and GPU",
]

[dependency-groups]
dev = ["pytest>=8.4.2", "pytest-asyncio>=1.2.0"]
